[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataloader"
version = "0.1.0"
description = "Minimal typed DataLoader for ML training loops"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "rich"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests", "2_linalg/linalg_test", "3_scidata/tests"]
pythonpath = [".", "2_linalg", "3_scidata"]
